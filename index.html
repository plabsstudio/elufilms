<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elu Films</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0a;
      --cream: #f5f2ee;
      --gold: #b89a6a;
      --muted: #666;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-weight: 400;
      overflow-x: hidden;
    }

    /* NAV */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 1.2rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(to bottom, rgba(10,10,10,0.85) 0%, transparent 100%);
    }
    .logo img {
      height: 48px;
      width: auto;
      display: block;
    }
    .nav-right {
      display: flex;
      gap: 2rem;
      align-items: center;
    }
    .nav-right a {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.3s;
    }
    .nav-right a:hover { color: var(--cream); }

    /* HERO */
    .hero {
      position: relative;
      height: 100vh;
      overflow: hidden;
    }
    .hero video {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      filter: brightness(0.4);
    }
    .hero-text {
      position: absolute;
      bottom: 3.5rem;
      left: 2.5rem;
      z-index: 2;
    }
    .hero-text h1 {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-weight: 700;
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--cream);
      opacity: 0;
      animation: up 1.2s ease 0.3s forwards;
    }
    .hero-text p {
      margin-top: 1rem;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold);
      opacity: 0;
      animation: up 1s ease 0.8s forwards;
    }

    /* WORKS */
    .works {
      padding: 6rem 2.5rem;
    }
    .works-header {
      margin-bottom: 2rem;
    }
    .works-header h2 {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-weight: 700;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-width: 1000px;
    }

    /* REEL CARD */
    .reel-card {
      position: relative;
      aspect-ratio: 16/9;
      overflow: hidden;
      background: #111;
      display: block;
    }
    .reel-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.8);
      transition: filter 0.5s ease, transform 0.5s ease;
    }
    .reel-card:hover .reel-video {
      filter: brightness(0.6);
      transform: scale(1.03);
    }
    .reel-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.6) 0%, transparent 60%);
    }

    /* CONTACT */
    .contact {
      padding: 5rem 2.5rem 6rem;
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 4rem;
      align-items: start;
    }
    .contact-left h2 {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-weight: 700;
      font-size: 2.2rem;
      line-height: 1.15;
      color: var(--cream);
      margin-bottom: 1.2rem;
    }
    .contact-left p {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.82rem;
      line-height: 1.9;
      color: var(--muted);
      margin-bottom: 2rem;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.65rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cream);
      text-decoration: none;
      transition: color 0.3s;
    }
    .link-btn:hover { color: var(--gold); }
    .link-btn::before {
      content: '';
      display: block;
      width: 22px;
      height: 1px;
      background: currentColor;
      flex-shrink: 0;
    }

    /* FORM */
    form {
      display: flex;
      flex-direction: column;
      gap: 1.4rem;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .field label {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.55rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input,
    .field textarea {
      background: transparent;
      border: none;
      border-bottom: 1px solid #222;
      padding: 0.5rem 0;
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.85rem;
      font-weight: 300;
      color: var(--cream);
      outline: none;
      transition: border-color 0.3s;
      width: 100%;
    }
    .field input::placeholder,
    .field textarea::placeholder { color: #333; }
    .field input:focus,
    .field textarea:focus { border-bottom-color: var(--gold); }
    .field textarea { resize: none; min-height: 80px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4rem; }
    .send {
      background: none;
      border: 1px solid #333;
      color: var(--cream);
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      padding: 0.9rem 2.2rem;
      cursor: pointer;
      align-self: flex-start;
      transition: border-color 0.3s, color 0.3s, background 0.3s;
    }
    .send:hover {
      border-color: var(--cream);
      background: var(--cream);
      color: var(--bg);
    }

    /* FOOTER */
    footer {
      border-top: 1px solid #1a1a1a;
      padding: 1.5rem 2.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    footer span {
      font-family: 'Courier Prime', 'Courier New', monospace;
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ANIMATIONS */
    @keyframes up {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* MOBILE */
    @media (max-width: 640px) {
      nav { padding: 1rem 1.2rem; }
      .logo img { height: 38px; }
      .hero-text { bottom: 2rem; left: 1.2rem; right: 1.2rem; }
      .hero-text h1 { font-size: 2.4rem; }
      .works { padding: 2.5rem 1.2rem; }
      .works-header { margin-bottom: 1rem; }
      .grid { grid-template-columns: 1fr; max-width: 100%; }
      .contact { grid-template-columns: 1fr; gap: 2rem; padding: 2.5rem 1.2rem 3rem; }
      .contact-left h2 { font-size: 1.7rem; }
      .two { grid-template-columns: 1fr; }
      .send { width: 100%; text-align: center; }
      footer { flex-direction: column; gap: 0.3rem; padding: 1rem 1.2rem; }
      .nav-right a:not(:last-child) { display: none; }
    }
  </style>
</head>
